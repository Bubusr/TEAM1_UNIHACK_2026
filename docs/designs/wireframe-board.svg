<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">PawVerse sanctuary game design board</title>
  <desc id="desc">Polished game design screens for the main sanctuary, pet care sheet, shop sheet, and capture result.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8dca8"/><stop offset="1" stop-color="#f3c989"/></linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a7ca83"/><stop offset="1" stop-color="#6da568"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bc7c3"/><stop offset="1" stop-color="#4f9fa4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#213d32" flood-opacity=".18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .bg{fill:#e9dfc9}.ink{fill:#29483b}.muted{fill:#6c7d6c}.cream{fill:#fff8e9}.paper{fill:#fffaf0}.sage{fill:#dce8cf}.green{fill:#315f49}.coral{fill:#c86d4f}.gold{fill:#efc35e}.brown{fill:#885b43}.line{fill:none;stroke:#29483b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.label{fill:#c86d4f;font:700 12px Arial,sans-serif;letter-spacing:2px}.title{fill:#29483b;font:500 30px Georgia,serif}.body{fill:#6c7d6c;font:14px Arial,sans-serif}.small{fill:#6c7d6c;font:12px Arial,sans-serif}.white{fill:#fff8e9;font:700 14px Arial,sans-serif}.button{fill:#c86d4f}.screen{fill:#fff8e9;stroke:#29483b;stroke-width:3}.round{stroke-linecap:round}.shadow{filter:url(#shadow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <path fill="#d9c9ad" opacity=".45" d="M0 115q240-80 480 0t480 0 480 0 480 0v-115H0z"/>
  <text class="label" x="70" y="58">PAWVERSE / SANCTUARY GAME</text>
  <text class="title" x="70" y="98">A gentle place to come back to.</text>
  <text class="body" x="70" y="125">The farm is the game. Menus are quiet, tactile, and only appear when the player asks.</text>

  <!-- Main sanctuary -->
  <g transform="translate(70 170)">
    <text class="label" x="0" y="-18">HOME / THE SANCTUARY</text>
    <rect class="screen shadow" width="580" height="700" rx="34"/>
    <rect fill="url(#sky)" x="16" y="16" width="548" height="210" rx="24"/>
    <circle fill="#f3bc61" cx="472" cy="82" r="31"/><path fill="#fff1d2" opacity=".65" d="M38 115q58-38 122 0 55-39 121 0 55-35 121 0v52H38z"/>
    <path fill="url(#meadow)" d="M16 184q126-70 274 0 145-80 274 0v323H16z"/>
    <path fill="#ead09b" d="M277 184c82 55 107 109 75 157-28 41-15 91 45 166h-60c-56-74-72-133-42-180 25-39 16-83-54-143z"/>
    <ellipse fill="#c6a875" opacity=".35" cx="291" cy="362" rx="150" ry="104"/>
    <ellipse fill="#d7bb83" cx="291" cy="348" rx="137" ry="96"/>
    <path fill="#ead09b" d="M18 331c108-24 186-8 246 20 84 39 166 32 300-5v31c-116 37-221 50-314 7-68-31-140-40-232-18z"/>
    <!-- trees -->
    <g transform="translate(45 202)"><path fill="#76513e" d="M29 80h14l5 57H23z"/><circle fill="#477a56" cx="35" cy="61" r="34"/><circle fill="#639565" cx="12" cy="75" r="22"/></g>
    <g transform="translate(472 185)"><path fill="#76513e" d="M29 90h14l5 52H23z"/><circle fill="#477a56" cx="35" cy="64" r="35"/><circle fill="#639565" cx="62" cy="76" r="23"/></g>
    <!-- barn -->
    <g transform="translate(42 232) scale(.7)" class="shadow"><path fill="#a95443" stroke="#7e443c" stroke-width="3" d="M0 46L91 0l91 46v136H0z"/><path fill="#d67c56" stroke="#7e443c" stroke-width="3" d="M-9 49L91-10l100 59-9 17L91 12 9 66z"/><path fill="#c87952" d="M66 103h50v79H66z"/><path class="line" d="M91 103v79M66 140h50"/><rect fill="#f3c989" x="27" y="90" width="32" height="22" rx="5"/><rect fill="#f3c989" x="122" y="90" width="32" height="22" rx="5"/></g>
    <path fill="#a66d46" stroke="#805541" stroke-width="3" d="M205 234q55-23 103 3 35 19 70 3v60q-45 21-83 0-42-23-90-2z"/><path fill="#7eaa59" d="M224 259q25-12 49 0t48 0M219 278q25-12 49 0t48 0" stroke="#477a56" stroke-width="5" fill="none"/><circle fill="#efc35e" cx="231" cy="241" r="7"/><circle fill="#c86d4f" cx="267" cy="239" r="7"/><circle fill="#efc35e" cx="303" cy="242" r="7"/>
    <!-- pond -->
    <path fill="url(#water)" stroke="#29483b" stroke-width="3" d="M40 463q18-45 76-51 64-5 104 31 24 24-17 53-61 42-133 19-44-13-30-52z"/><path class="line" opacity=".65" d="M75 457q24-14 48 0t48 0M97 475q23-13 47 0"/><path fill="#76a75e" d="M38 457q-12-30 4-50 13 27 32 41-24-1-36 9z"/>
    <!-- shop -->
    <g transform="translate(414 382) scale(.72)" class="shadow"><rect fill="#d88a55" stroke="#805541" stroke-width="3" width="125" height="107" rx="18"/><path fill="#f0c05c" stroke="#805541" stroke-width="3" d="M-8 12h141l-16-30H8z"/><path fill="#c86d4f" d="M11 12h21v-30H11zM54 12h21v-30H54zM97 12h21v-30H97z"/><rect fill="#805541" x="23" y="55" width="78" height="52" rx="12"/></g>
    <!-- pen -->
    <g transform="translate(386 238) rotate(-4)"><path fill="#dce8cf" stroke="#8c704e" stroke-width="3" d="M5 11q68-19 139 0l-7 76q-66 16-134 0z"/><path stroke="#8c704e" stroke-width="6" d="M5 37q68-16 139 0M2 63q68-13 135 0M39 4l-3 85M77 1l-1 88M115 4l3 82"/><circle class="coral" cx="79" cy="48" r="17"/></g>
    <!-- pet -->
    <g transform="translate(279 392)" class="shadow"><ellipse fill="#426d4e" opacity=".3" cx="36" cy="74" rx="34" ry="9"/><circle fill="#e7a65b" stroke="#29483b" stroke-width="3" cx="36" cy="40" r="31"/><path fill="#e7a65b" stroke="#29483b" stroke-width="3" d="M13 20L3-6l29 18M59 20L69-6 40 12z"/><circle class="ink" cx="26" cy="38" r="3"/><circle class="ink" cx="47" cy="38" r="3"/><path class="line" d="M29 53q8 7 15 0"/></g>
    <!-- top and bottom chrome -->
    <rect class="cream" x="35" y="42" width="184" height="58" rx="20" opacity=".94"/><text class="label" x="54" y="66">MOCHI'S FARM</text><text class="body" x="54" y="86">Fence safe for 18h 24m</text>
    <rect class="green" x="35" y="610" width="510" height="58" rx="20"/><text class="white" x="62" y="646">⌂</text><text class="white" x="175" y="646">◎</text><text class="white" x="288" y="646">◌</text><text class="white" x="401" y="646">☻</text><text fill="#efc35e" font-family="Arial" font-size="11" x="52" y="660">HOME</text>
  </g>

  <!-- Care sheet -->
  <g transform="translate(700 170)">
    <text class="label" x="0" y="-18">PET CARE / A BOTTOM SHEET</text>
    <rect class="screen shadow" width="390" height="700" rx="34"/>
    <rect fill="#dce8cf" x="16" y="16" width="358" height="323" rx="24"/>
    <path fill="#a7ca83" d="M16 240q90-60 179 0 90-60 179 0v99H16z"/>
    <circle fill="#e7a65b" stroke="#29483b" stroke-width="3" cx="195" cy="160" r="68"/><path fill="#e7a65b" stroke="#29483b" stroke-width="3" d="M145 122l-18-43 48 27M245 122l18-43-48 27z"/><circle class="ink" cx="173" cy="157" r="5"/><circle class="ink" cx="217" cy="157" r="5"/><path class="line" d="M176 184q19 15 38 0"/><path class="line" d="M130 186h-45M130 200H77M260 186h45M260 200h53"/>
    <rect class="paper" x="16" y="300" width="358" height="384" rx="28"/><text class="label" x="44" y="346">MOCHI</text><text class="title" x="44" y="383">Orange cat · curious soul</text><text class="body" x="44" y="416">120 / 200 EXP</text><rect fill="#e1d6c0" x="44" y="430" width="302" height="9" rx="5"/><rect class="gold" x="44" y="430" width="182" height="9" rx="5"/>
    <text class="body" x="44" y="475">Affection</text><text class="title" x="277" y="479">74%</text><path stroke="#d7c7aa" d="M44 500h302"/>
    <rect class="sage" x="44" y="527" width="88" height="96" rx="15"/><text class="title" x="76" y="568">♡</text><text class="body" x="65" y="597">Pet</text><text class="small" x="62" y="615">4 / 5</text>
    <rect class="sage" x="151" y="527" width="88" height="96" rx="15"/><text class="title" x="182" y="568">◌</text><text class="body" x="172" y="597">Play</text><text class="small" x="169" y="615">1 / 2</text>
    <rect class="sage" x="258" y="527" width="88" height="96" rx="15"/><text class="title" x="289" y="568">♢</text><text class="body" x="278" y="597">Feed</text><text class="small" x="276" y="615">2 / 3</text>
  </g>

  <!-- Shop sheet and capture -->
  <g transform="translate(1120 170)">
    <text class="label" x="0" y="-18">SHOP / A PLACE, NOT A MENU</text>
    <rect class="screen shadow" width="410" height="330" rx="34"/><rect fill="#dce8cf" x="16" y="16" width="378" height="298" rx="24"/>
    <path fill="#a7ca83" d="M16 191q90-65 189 0 90-65 189 0v123H16z"/><path fill="#d9b879" d="M16 231h378v30H16z"/>
    <g transform="translate(46 83)"><rect fill="#d88a55" stroke="#29483b" stroke-width="3" width="120" height="108" rx="12"/><path fill="#f0c05c" d="M-7 12h134l-15-30H8z"/><path fill="#c86d4f" d="M10 12h20v-30H10zM51 12h20v-30H51zM92 12h20v-30H92z"/><rect fill="#805541" x="24" y="55" width="72" height="53" rx="6"/><text class="white" x="38" y="43">STALL</text></g>
    <rect class="paper" x="186" y="48" width="187" height="235" rx="18"/><text class="label" x="208" y="81">TODAY'S STALL</text><text class="title" x="208" y="113">Seeds &amp; bowls</text><path stroke="#d7c7aa" d="M208 127h145"/><text class="body" x="208" y="158">🌱 Seeds</text><text class="small" x="208" y="178">grow a meal later</text><rect class="gold" x="304" y="145" width="57" height="31" rx="8"/><text class="text" x="317" y="166">5 K</text><text class="body" x="208" y="214">🥣 Ready food</text><text class="small" x="208" y="234">care for Mochi now</text><rect class="gold" x="304" y="201" width="57" height="31" rx="8"/><text class="text" x="317" y="222">8 K</text><text class="small" x="208" y="264">24 Kibble in your pouch</text>

    <text class="label" x="0" y="390">SNAP / A MOMENT WITH AN ANIMAL</text>
    <rect class="screen shadow" y="410" width="410" height="300" rx="34"/><rect fill="url(#sky)" x="16" y="426" width="378" height="268" rx="24"/><path fill="#78a96c" d="M16 602q100-80 190 0 90-80 188 0v92H16z"/><circle fill="#f3bc61" cx="326" cy="475" r="29"/><circle fill="#e7a65b" stroke="#29483b" stroke-width="3" cx="194" cy="561" r="48"/><path fill="#e7a65b" stroke="#29483b" stroke-width="3" d="M159 531l-14-31 31 17M229 531l14-31-31 17z"/><circle class="ink" cx="180" cy="558" r="4"/><circle class="ink" cx="208" cy="558" r="4"/><path class="line" d="M183 578q11 8 22 0"/><rect class="cream" x="37" y="450" width="150" height="50" rx="16"/><text class="label" x="54" y="472">TODAY'S THEME</text><text class="body" x="54" y="489">a curious moment</text><rect class="coral" x="148" y="645" width="95" height="31" rx="16"/><text class="white" x="169" y="666">CAPTURE</text>
  </g>

  <text class="body" x="72" y="930">Design notes: one strong scene, soft paper surfaces, real pet imagery, and actions that happen in context.</text>
</svg>
